# Testcontainers settings for this project's migration gate.
#
# api.version: Testcontainers defaults to Docker API 1.32, and Docker Engine 29
# rejects anything below 1.44 outright ("client version 1.32 is too old"). Left
# at the default, the gate SKIPS on a current Docker instead of failing — a gate
# that reports success by not running. Raising it here rather than in each
# developer's ~/.testcontainers.properties keeps the fix with the code.
api.version=1.44

# Ryuk is Testcontainers' cleanup sidecar. Left enabled; it reaps the MySQL
# container if the JVM dies mid-run, which matters because this suite starts a
# real database.
#
# NOT set here, because it is machine-specific rather than project-specific:
#   DOCKER_HOST and docker.client.strategy. A Colima user needs
#     export DOCKER_HOST="unix://${HOME}/.colima/default/docker.sock"
#     export TESTCONTAINERS_DOCKER_CLIENT_STRATEGY=org.testcontainers.dockerclient.EnvironmentAndSystemPropertyClientProviderStrategy
#   because there is no /var/run/docker.sock to find. Docker Desktop needs
#   neither. See db/migration/README.md.
#
# ⚠ DOCKER_HOST alone is not enough under Colima, which cost a session. With it
# set, Testcontainers connects — "Connected to docker" is printed — and then Ryuk
# dies bind-mounting the socket:
#
#   Status 500: error while creating mount source path
#   '/Users/…/.colima/default/docker.sock': operation not supported
#
# and all 140 container tests SKIP while the build still says BUILD SUCCESS. The
# fix is TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock, which is in
# the POM's surefire <environmentVariables> because Ryuk reads it from the
# ENVIRONMENT ONLY — docker.socket.override set in this file is not consulted,
# which was tested rather than assumed.
#
# ContainerGateTest now fails the build when Docker is unreachable, so this can
# be rediscovered in one red line instead of by noticing a skip count.
