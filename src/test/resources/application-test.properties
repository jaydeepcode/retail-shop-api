spring.application.name=Retail shop app - Test
spring.profiles.active=test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=test-secret-key-for-testing-only
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# Security
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:8081
app.security.https.required=false

# Water ESP (Mock)
water.esp.api.url=http://localhost:9999/mock
water.esp.api.key=test-key

# Server
server.port=0

# Logging
logging.level.com.mangle.retailshopapp=DEBUG

