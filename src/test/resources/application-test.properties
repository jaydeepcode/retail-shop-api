spring.application.name=Retail shop app - Test
# NOTE: spring.profiles.active must NOT be set here. Spring Boot rejects it in a
# profile-specific resource (InvalidConfigDataPropertyException), which is why this
# profile was unloadable and the suite had never run. Tests select it with @ActiveProfiles.

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway off for tests: the migrations are MySQL-specific and cannot run on H2.
# Hibernate builds the test schema from the entities instead.
spring.flyway.enabled=false
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=test-secret-key-for-testing-only
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# Security
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:8081
app.security.https.required=false

# Water ESP (Mock)
water.esp.api.url=http://localhost:9999/mock
water.esp.api.key=test-key

# Server
server.port=0

# Logging
logging.level.com.mangle.retailshopapp=DEBUG

