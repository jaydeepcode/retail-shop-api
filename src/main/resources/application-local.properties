spring.application.name=Retail shop app

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/recharge
spring.datasource.username=CISADM
spring.datasource.password=cisadm
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (jjwt 0.9.1 - stable)
jwt.secret=local-dev-secret-key-change-in-production
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# Security
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:8081,http://localhost:19006
app.security.https.required=false

# Push Notifications (FCM)
fcm.server.key=
fcm.enabled=false

# Water ESP
water.esp.api.url=http://waterpump_inside.local/api/v1
water.esp.api.key=Basic YWRtaW46YWRtaW4xMjM=

# Server
server.port=8080
server.servlet.context-path=/api
server.ssl.enabled=false

# Logging
logging.level.com.mangle.retailshopapp=DEBUG
logging.level.org.springframework.security=DEBUG
