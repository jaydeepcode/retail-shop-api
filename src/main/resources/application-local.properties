spring.application.name=Retail shop app

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/recharge
spring.datasource.username=${DB_USERNAME:CISADM}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# validate, never update: fail fast if an entity and the schema disagree, rather than
# letting Hibernate silently create FK-less, trigger-less tables that migrations then skip.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration (jjwt 0.9.1 - stable)
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# Security
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8081,http://localhost:19006
app.security.https.required=false

# Push Notifications (FCM)
fcm.server.key=
fcm.enabled=false

# Water ESP
water.esp.api.url=http://waterpump_inside.local/api/v1
water.esp.api.key=${WATER_ESP_API_KEY}
water.esp.mock.enabled=true

# Server
server.port=8080
server.servlet.context-path=/api
server.ssl.enabled=false

# Logging
logging.level.com.mangle.retailshopapp=DEBUG
logging.level.org.springframework.security=DEBUG
