# ============================================================================
# The "container" profile — run the app against a THROWAWAY database
# ============================================================================
# Why this profile exists: there was no safe way to start this application.
#
# ⚠ THE `local` PROFILE POINTS AT THE DEVELOPER RESTORE. application.properties
# sets spring.datasource.url to localhost:3306/recharge with Flyway enabled and
# NO target, so `mvn spring-boot:run` against it would migrate the restore, write
# counter sales into it, and POST VOUCHERS TO IT — which next-session-s3.md
# forbids outright: "the ledger stays empty until the opening journal ...
# Containers are where vouchers get posted."
#
# So S3's own gate — "run real recharges on it" — had nowhere to run. This is
# that somewhere: the same throwaway MySQL the five container gates already use,
# driven by hand instead of by JUnit.
#
# Start the database with local-dev/README.md's one command, then:
#
#     SPRING_PROFILES_ACTIVE=container \
#     DB_PASSWORD=s3pass JWT_SECRET=<32+ chars> \
#     mvn spring-boot:run
#
# ⚠ NOT FOR PRODUCTION AND NOT FOR THE RESTORE. Port 3307 is deliberate: the
# real local MySQL sits on 3306, so a mistyped profile connects to nothing rather
# than to the wrong database.
# ============================================================================

spring.datasource.url=jdbc:mysql://localhost:3307/recharge
spring.datasource.username=${DB_USERNAME:CISADM}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ⚠ `none`, not `validate`, and the reason is the fixture rather than laziness.
# db/legacy-baseline.sql reproduces the 8 pre-Flyway tables the migration gates
# need, not all 13 — `rc_usr_api_kys`, `rc_pn_tokens`, `wt_purchase_party`,
# `wt_purchase_details` and `wt_adt_lgs` are absent, because no gate reads them.
# `validate` would refuse to start over tables this slice never touches.
#
# It must never be `update`. implementation-plan.md §0.1: Hibernate would create
# its own FK-less, trigger-less copies and the migrations' IF NOT EXISTS guards
# would then skip the real ones — "no data gate can detect this class of damage."
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ⚠ CAPPED, which is the whole point of the profile, and the cap is the current
# head rather than a fixed number.
# V13-V19 are cutover work: V13 moves the CRDT rows out of the item table and V14
# adds CHECK (amt_returned >= 0), which breaks the legacy app's next UPI write.
# Capping here means adding a V13 file later cannot quietly pull it into a
# developer's local run.
#
# Raised 28 -> 29 for V29 (the unique retry key #12 relies on). Raising the cap
# does NOT relax the exclusion: out-of-order=false and V29 being above the
# reserved block mean V13-V19 still cannot apply. The cap has to move with the
# head or the newest migration silently never runs locally — which would have
# left #12's duplicate-retry guard absent in exactly the environment where it is
# clicked through by hand.
#
# baseline-version=8 matches both production and the fixture: the pre-Flyway
# tables are already present, so V1-V8 must not re-run.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8
spring.flyway.target=29
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# The Angular dev server, so the counter can be driven from a browser.
app.security.cors.allowed-origins=http://localhost:4200
app.security.https.required=false

# Nothing in this profile may reach the outside world: no push notifications and
# no pump hardware. The water module's ESP client is mocked for the same reason
# the local profile mocks it.
fcm.server.key=
fcm.enabled=false
water.esp.api.url=http://localhost:9/mock
water.esp.api.key=unused-in-container
water.esp.mock.enabled=true
