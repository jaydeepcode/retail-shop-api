spring.application.name=Retail shop app

# Active Profile (use 'local' for development, 'prod' for production)
# Can be overridden with -Dspring.profiles.active=prod
spring.profiles.active=local

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/recharge
spring.datasource.username=${DB_USERNAME:CISADM}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# false: a migration may only be applied if its version is above everything already applied.
# Verified safe - the DB is at version 8 and all new migrations start at V9. true would let a
# migration added below the current version apply silently later, which is how the V5 gap went
# unnoticed. The absent V8 file does not affect this; Flyway validates the 8 applied migrations.
spring.flyway.out-of-order=false

# ⚠ CAPPED AT THE CURRENT HEAD, and this is inherited by BOTH the local and prod
# profiles - neither declares a Flyway block of its own.
#
# Until now only application-container.properties had a target, so the profile
# the shop actually deploys with was uncapped. V13-V19 are cutover work:
# V13 moves the CRDT rows out of the item table and V14 adds
# CHECK (amt_returned >= 0), which breaks the legacy app's next UPI write. The
# day a V13 file is committed, an uncapped start applies it - and the owner's
# gate is the first time this runs against production alongside the live legacy
# writer, which is exactly the situation that must not auto-migrate into
# cutover.
#
# It is a cap, not a freeze: raise it with each new migration, as V30 did here.
# implementation-plan.md §0.2 is what makes that safe - V9-V12 and V20-V30 are
# all "safe alongside the legacy app", so a capped start can apply everything
# the counter needs and nothing it must not.
#
# Raising it is a DELIBERATE act and never a side effect of adding a file
# (local-dev/OWNER-GATE.md). V13-V19 are the cutover's, and this cap is what
# keeps them out until S6 - V14 alone adds a CHECK that breaks the legacy app's
# next UPI write.
spring.flyway.target=30

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# Security Configuration
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8081,http://localhost:19006
app.security.https.required=false

# Water ESP Configuration
water.esp.api.url=http://waterpump_inside.local/api/v1
water.esp.api.key=${WATER_ESP_API_KEY}

# Push Notifications (FCM)
fcm.server.key=
fcm.enabled=false

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.forward-headers-strategy=FRAMEWORK

# Logging Configuration
logging.level.com.mangle.retailshopapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
