spring.application.name=Retail shop app

# Active Profile (use 'local' for development, 'prod' for production)
# Can be overridden with -Dspring.profiles.active=prod
spring.profiles.active=local

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/recharge
spring.datasource.username=CISADM
spring.datasource.password=cisadm
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# JWT Configuration
jwt.secret=local-dev-secret-key-change-in-production-12345678901234567890
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# Security Configuration
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8081,http://localhost:19006
app.security.https.required=false

# Water ESP Configuration
water.esp.api.url=http://waterpump_inside.local/api/v1
water.esp.api.key=Basic YWRtaW46YWRtaW4xMjM=

# Push Notifications (FCM)
fcm.server.key=
fcm.enabled=false

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.forward-headers-strategy=FRAMEWORK

# Logging Configuration
logging.level.com.mangle.retailshopapp=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=INFO
