spring.application.name=Retail shop app
spring.profiles.active=prod

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000
jwt.api-key.expiration=2592000000

# Security
app.security.cors.allowed-origins=${CORS_ORIGINS}
app.security.https.required=true

# Push Notifications
fcm.server.key=${FCM_SERVER_KEY}
fcm.enabled=true

# Water ESP
water.esp.api.url=${WATER_ESP_API_URL}
water.esp.api.key=${WATER_ESP_API_KEY}

# Server
server.port=8080
server.servlet.context-path=/api
server.ssl.enabled=false

# Logging
logging.level.com.mangle.retailshopapp=WARN
logging.level.org.springframework.security=WARN
